<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pixel Blade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;width:100vw;height:100vh}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
#startScreen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0a0a15;z-index:100}
#startScreen h1{font-size:64px;color:#FFD700;text-shadow:0 0 20px #FFA500,3px 3px 0 #5C0000;letter-spacing:6px;margin-bottom:5px}
#startScreen .sub{color:#B8860B;font-size:16px;margin-bottom:30px;letter-spacing:3px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}
.keybox{background:rgba(139,69,19,0.3);border:2px solid #8B4513;padding:10px;text-align:center;color:#DDD;font-size:12px}
.keybox b{display:block;color:#FFD700;font-size:14px;margin-bottom:4px}
#startBtn{padding:18px 50px;font-size:20px;font-family:'Courier New',monospace;background:linear-gradient(#8B0000,#5C0000);color:#FFD700;border:3px solid #FFD700;cursor:pointer;font-weight:bold;letter-spacing:3px}
#startBtn:hover{background:linear-gradient(#A52A2A,#8B0000);box-shadow:0 0 30px rgba(255,215,0,0.4)}
.menuBtns{display:flex;gap:15px;margin-top:15px}
.menuBtns button{padding:14px 35px;font-size:16px;font-family:'Courier New',monospace;background:linear-gradient(#228B22,#145214);color:#FFD700;border:3px solid #FFD700;cursor:pointer;font-weight:bold;letter-spacing:2px}
.menuBtns button:hover{box-shadow:0 0 20px rgba(255,215,0,0.3)}
#deathScreen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(80,0,0,0.95);z-index:100}
#deathScreen h1{font-size:52px;color:#FF0000;text-shadow:3px 3px 0 #000;margin-bottom:20px}
#deathScreen .stats{color:#FFF;font-size:14px;margin-bottom:30px;line-height:1.8;text-align:left;max-width:500px}
#deathScreen button{padding:18px 50px;font-size:18px;font-family:'Courier New',monospace;background:#8B0000;color:#FFD700;border:3px solid #FFD700;cursor:pointer;font-weight:bold}
#shopUI{position:fixed;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.85);z-index:50}
.shopBox{background:#1a0f0a;border:4px solid #8B4513;min-width:420px;max-width:600px}
.shopHead{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#2C1810;border-bottom:3px solid #8B4513}
.shopHead h2{color:#FFD700;font-size:22px}
.shopClose{width:35px;height:35px;background:#8B0000;color:#FFD700;border:2px solid #FFD700;font-size:18px;font-weight:bold;cursor:pointer}
.shopItems{padding:15px;display:flex;flex-direction:column;gap:10px;max-height:350px;overflow-y:auto}
.sItem{display:flex;align-items:center;gap:12px;background:#2C1810;border:2px solid #5C3317;padding:12px;cursor:pointer;transition:0.15s}
.sItem:hover{border-color:#FFD700;transform:translateX(3px)}
.sItem.owned{border-color:#228B22;opacity:0.6}
.sItem .icon{font-size:24px;width:40px;text-align:center}
.sItem .info{flex:1}
.sItem .name{color:#FFD700;font-weight:bold;font-size:14px}
.sItem .desc{color:#999;font-size:11px}
.sItem .price{color:#FFD700;font-weight:bold;padding:6px 12px;background:#1a0f0a;border:2px solid #8B4513;font-size:13px}
.shopFoot{padding:12px 20px;background:#1a0f0a;border-top:3px solid #8B4513;text-align:right;color:#FFD700;font-weight:bold;font-size:16px}
#mpLobby{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(5,5,25,0.97);z-index:110}
#mpLobby h2{color:#FFD700;font-size:36px;margin-bottom:25px;text-shadow:0 0 15px #FFA500}
.mpBox{background:#1a0f0a;border:3px solid #8B4513;padding:30px 40px;text-align:center;min-width:350px}
.mpBox label{color:#CCC;font-size:14px;display:block;margin-bottom:8px;text-align:left}
.mpBox input{width:100%;padding:12px;font-size:16px;font-family:'Courier New',monospace;background:#0a0a15;color:#FFD700;border:2px solid #5C3317;margin-bottom:18px;text-align:center;letter-spacing:2px}
.mpBox input:focus{outline:none;border-color:#FFD700}
.mpBox .code{font-size:48px;color:#FFD700;letter-spacing:12px;margin:20px 0;font-weight:bold}
.mpBtns{display:flex;gap:12px;justify-content:center;margin-top:10px}
.mpBtns button{padding:14px 30px;font-size:15px;font-family:'Courier New',monospace;background:linear-gradient(#228B22,#145214);color:#FFD700;border:2px solid #FFD700;cursor:pointer;font-weight:bold;letter-spacing:1px}
.mpBtns button:hover{box-shadow:0 0 15px rgba(255,215,0,0.3)}
.mpBtns .cancel{background:linear-gradient(#8B0000,#5C0000)}
.mpStatus{color:#AAA;font-size:13px;margin-top:15px;min-height:20px}
#mpWait{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(5,5,25,0.97);z-index:115}
#mpWait .room{font-size:72px;color:#FFD700;letter-spacing:12px;margin:15px 0;text-shadow:0 0 30px #FFA500}
#mpWait p{color:#AAA;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="startScreen">
  <h1>PIXEL BLADE</h1>
  <div class="sub">Guerrero Medieval</div>
  <div class="keys">
    <div class="keybox"><b>W A S D</b>Mover</div>
    <div class="keybox"><b>ESPACIO</b>Atacar</div>
    <div class="keybox"><b>SHIFT</b>Esquivar</div>
    <div class="keybox"><b>1 2 3</b>Armas</div>
    <div class="keybox"><b>E</b>Interactuar</div>
    <div class="keybox"><b>Q</b>Pocion</div>
  </div>
  <button id="startBtn" onclick="startGame()">COMENZAR</button>
  <div class="menuBtns">
    <button onclick="showMP()">ONLINE</button>
    <button onclick="showLB()">RANKING</button>
    <button onclick="changeName()">CAMBIAR NOMBRE</button>
  </div>
</div>
<div id="deathScreen">
  <h1>HAS CAIDO</h1>
  <div class="stats" id="dStats"></div>
  <button onclick="startGame()">REINTENTAR</button>
</div>
<div id="shopUI">
  <div class="shopBox">
    <div class="shopHead"><h2 id="sTitle"></h2><button class="shopClose" onclick="closeShop()">X</button></div>
    <div class="shopItems" id="sItems"></div>
    <div class="shopFoot" id="sCoins"></div>
  </div>
</div>
<div id="mpLobby">
  <h2>MULTIJUGADOR ONLINE</h2>
  <div class="mpBox">
    <label>Tu nombre:</label>
    <input type="text" id="mpName" maxlength="12" placeholder="Jugador">
    <label>Codigo de sala (tu eleccion):</label>
    <input type="text" id="mpCustomCode" maxlength="4" placeholder="1234" style="letter-spacing:8px;font-size:24px">
    <div class="mpBtns">
      <button onclick="mpCreate()">CREAR SALA</button>
      <button class="cancel" onclick="hideMP()">VOLVER</button>
    </div>
    <hr style="border-color:#333;margin:18px 0">
    <label>Unirse a sala (codigo):</label>
    <input type="text" id="mpJoinCode" maxlength="4" placeholder="0000" style="letter-spacing:8px;font-size:24px">
    <div class="mpBtns">
      <button onclick="mpJoinFromInput()">UNIRSE</button>
    </div>
    <div class="mpStatus" id="mpStatus"></div>
  </div>
</div>
<div id="mpWait">
  <p>Comparte este codigo con tu amigo:</p>
  <div class="room" id="mpRoomCode">----</div>
  <p id="mpWaitStatus">Esperando jugador...</p>
  <div class="mpBtns" style="margin-top:20px">
    <button class="cancel" onclick="mpLeave()">CANCELAR</button>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
